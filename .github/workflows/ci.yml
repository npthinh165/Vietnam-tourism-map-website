name: Validate travel app
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
        python: ['3.11', '3.14']
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: travel_test
          POSTGRES_PASSWORD: travel_test
          POSTGRES_DB: travel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U travel_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: npm ci
      - run: npm run db:generate
      - run: npm run lint
      - run: npm test
      - run: python -m pytest
        env:
          TEST_DATABASE_URL: postgresql://travel_test:travel_test@localhost:5432/travel_test
      - run: npm run build
      - run: npm audit --audit-level=high
