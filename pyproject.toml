[project]
name = "vietnam-travel-map"
version = "1.0.0"
description = "Python backend for the Vietnam travel map"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests_python"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
